[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG learning project: Django + DRF + Channels + Hatchet + pgvector"
authors = [
    { name = "Ruan", email = "ruan@sdx.co.za" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3.0",
    "channels-redis>=4.3.0",
    "channels[daphne]>=4.3.2",
    "cryptography>=50.0.2",
    "django>=6.1,<6.2",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "google-genai>=2.33.0",
    "hatchet-sdk>=1.43.0",
    "openai>=3.37.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
